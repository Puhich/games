function fit(){const vw=(window.visualViewport?visualViewport.width:innerWidth),vh=(window.visualViewport?visualViewport.height:innerHeight);const s=Math.min(vw/W,vh/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function mkPat(level){const c=document.createElement('canvas');c.width=4;c.height=4;const x=c.getContext('2d');
  x.fillStyle='#000';x.fillRect(0,0,4,4);x.fillStyle='#fff';
  for(let i=0;i<16;i++)if(BAYER[i]<level)x.fillRect(i%4,(i/4)|0,1,1);return ctx.createPattern(c,'repeat');}
const P=['#000',mkPat(4),mkPat(8),mkPat(12),'#fff'];
const Y='#ffe000',GR='#808090';
function mkPatY(level){const c=document.createElement('canvas');c.width=4;c.height=4;const x=c.getContext('2d');
  x.fillStyle='#000';x.fillRect(0,0,4,4);x.fillStyle=Y;
  for(let i=0;i<16;i++)if(BAYER[i]<level)x.fillRect(i%4,(i/4)|0,1,1);return ctx.createPattern(c,'repeat');}
const PY=[null,mkPatY(4),mkPatY(8),mkPatY(12)];

function txt(s,x,y,sc,al,col,ol){
  sc=sc||1;al=al||'center';col=col||'#fff';ol=ol===undefined?'#000':ol;
  s=String(s).toUpperCase().replace(/Ё/g,'Е');
  const adv=ch=>ch==='№'?10*sc:6*sc;let w=0;for(const ch of s)w+=adv(ch);w-=sc;
  let x0=Math.round(al==='center'?x-w/2:al==='right'?x-w:x);y=Math.round(y);
  const draw=(c,dx,dy)=>{ctx.fillStyle=c;let cx=x0;for(const ch of s){
    if(ch==='№'){const gl=FONT['N'];for(let r=0;r<7;r++)for(let k=0;k<5;k++)if(gl[r][k]==='#')ctx.fillRect(cx+k*sc+dx,y+r*sc+dy,sc,sc);
      const o=['.#.','#.#','.#.','...','###'];for(let r=0;r<5;r++)for(let k=0;k<3;k++)if(o[r][k]==='#')ctx.fillRect(cx+(6+k)*sc+dx,y+r*sc+dy,sc,sc);}
    else{const gl=FONT[ch]||FONT['?'];for(let r=0;r<7;r++)for(let k=0;k<5;k++)if(gl[r][k]==='#')ctx.fillRect(cx+k*sc+dx,y+r*sc+dy,sc,sc);}
    cx+=adv(ch);}};
  if(ol){draw(ol,1,0);draw(ol,-1,0);draw(ol,0,1);draw(ol,0,-1);}
  draw(col,0,0);
  return w;
}

// ---------- sounds (tiny WebAudio synth) ----------
let AC=null,hiss=null,hissG=null;
function audioUnlock(){if(!AC)return;if(AC.state!=='running')AC.resume();const b=AC.createBuffer(1,1,22050),sr=AC.createBufferSource();sr.buffer=b;sr.connect(AC.destination);sr.start(0);}
function audioInit(){
  if(AC){audioUnlock();return;}try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AC.noise=buf;
  hiss=AC.createBufferSource();hiss.buffer=buf;hiss.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=0.7;
  hissG=AC.createGain();hissG.gain.value=0;hiss.connect(f);f.connect(hissG);hissG.connect(AC.destination);hiss.start();audioUnlock();}
function setHiss(v){if(hissG)hissG.gain.setTargetAtTime(v,AC.currentTime,0.08);}
function beep(f0,dur,type,g,f1){if(!AC)return;const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,AC.currentTime);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,AC.currentTime+dur);gn.gain.setValueAtTime(g||0.08,AC.currentTime);gn.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);}
function noise(dur,f0,f1,g,q){if(!AC)return;const sr=AC.createBufferSource();sr.buffer=AC.noise;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=q||1;
  f.frequency.setValueAtTime(f0,AC.currentTime);f.frequency.exponentialRampToValueAtTime(f1||f0,AC.currentTime+dur);const gn=AC.createGain();gn.gain.setValueAtTime(g||0.1,AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);sr.connect(f);f.connect(gn);gn.connect(AC.destination);sr.start();sr.stop(AC.currentTime+dur);}
let hapEl=null,hapQ=0,inGesture=false;
function hapticNow(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}
  const once=()=>{try{const l=document.createElement('label');const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');l.appendChild(i);
      l.style.cssText='position:absolute;left:-9999px;top:-9999px';document.body.appendChild(l);l.click();setTimeout(()=>l.remove(),50);}catch(e){}};
  const n=Array.isArray(ms)?Math.min(3,Math.ceil(ms.length/2)):(ms>=60?2:1);for(let k=0;k<n;k++)setTimeout(once,k*90);}
function haptic(ms){if(inGesture)hapticNow(ms);else hapQ=Math.min(3,hapQ+(Array.isArray(ms)?2:1));}
function flushHaptics(){if(hapQ>0){const n=hapQ;hapQ=0;hapticNow(n>=2?[30,40,30]:20);}}
// ---------- title chiptune ----------
const MUS={on:false,next:0,step:0,bpm:118};
const M_LEAD=[72,0,75,0,79,0,75,0, 72,0,75,0,79,82,79,0, 70,0,74,0,77,0,74,0, 70,0,74,0,77,79,77,0,
              72,75,79,84,0,79,75,72, 74,0,77,0,81,0,77,0, 70,0,74,0,77,0,74,0, 72,0,0,0,72,0,0,0];
const M_ROOT=[48,46,41,43];
const mf=n=>440*Math.pow(2,(n-69)/12);
function tone(f,t0,dur,type,g){const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  gn.gain.setValueAtTime(0.0001,t0);gn.gain.exponentialRampToValueAtTime(g,t0+0.01);gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn);gn.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.02);}
function musStep(i,t0){const st=60/MUS.bpm/4;const n=M_LEAD[i%64];if(n)tone(mf(n),t0,st*0.9,'square',0.03);
  const bar=Math.floor(i/16)%4,k=i%16;const r=M_ROOT[bar];const bp=[r,0,r,0,r+12,0,r,0,r,0,r,0,r+12,0,r+7,0][k];if(bp)tone(mf(bp),t0,st*1.6,'triangle',0.09);
  if(k%8===0)tone(80,t0,0.14,'sine',0.12);if(k%4===2)noise(0.04,6000,3000,0.02,1);}
function musStart(){if(!AC||MUS.on)return;MUS.on=true;MUS.next=AC.currentTime+0.05;MUS.step=0;}
function musStop(){MUS.on=false;}
function musTick(){if(!MUS.on||!AC)return;while(MUS.next<AC.currentTime+0.2){musStep(MUS.step,MUS.next);MUS.step=(MUS.step+1)%64;MUS.next+=60/MUS.bpm/4;}}

  flush(){haptic([30,40,30,40,60]);noise(1.2,400,2500,0.12,0.5);noise(1.4,1200,200,0.08,0.8);},
  thud(){haptic(60);beep(90,0.3,'sine',0.15,35);noise(0.12,200,80,0.06);},

function say(kind,chance){if(Math.random()>chance)return;const now=performance.now()/1000;if(now-VOICE.last<2.5)return;VOICE.last=now;
  const list=VO[kind],t=list[Math.floor(Math.random()*list.length)];VOICE.sub=t;VOICE.subT=2;
  robotVoice(t);}
function robotVoice(t){if(!AC)return;const vow='АЕЁИОУЫЭЮЯ';let i=0,time0=AC.currentTime;
  for(const ch of t){if(ch===' '||ch===','){time0+=0.09;continue;}if(!/[А-ЯA-Z0-9]/.test(ch))continue;
    const isV=vow.includes(ch);const f=isV?90+(vow.indexOf(ch)*17):140+(ch.charCodeAt(0)%7)*25;const dur=isV?0.11:0.06;
    const o=AC.createOscillator(),gn=AC.createGain(),fl=AC.createBiquadFilter();o.type=isV?'sawtooth':'square';o.frequency.setValueAtTime(f,time0);o.frequency.linearRampToValueAtTime(f*0.85,time0+dur);
    fl.type='bandpass';fl.frequency.value=isV?600+vow.indexOf(ch)*120:1800;fl.Q.value=isV?4:1.5;
    gn.gain.setValueAtTime(0.0001,time0);gn.gain.exponentialRampToValueAtTime(isV?0.18:0.09,time0+0.01);gn.gain.exponentialRampToValueAtTime(0.0001,time0+dur);
    o.connect(fl);fl.connect(gn);gn.connect(AC.destination);o.start(time0);o.stop(time0+dur+0.01);time0+=dur+0.02;i++;}}
function drawSub(){if(VOICE.subT<=0)return;const w=VOICE.sub.length*6+18;const x0=Math.round(90-w/2),y0=280;rect(x0,y0,w,15,'#000','#fff');
  // speaker bars, vertically centered in the plate (plate inner height 13 -> center y0+7)
  ctx.fillStyle=Y;for(let i=0;i<3;i++){const h=1+(Math.floor(time*12+i)%3);ctx.fillRect(x0+4+i*2,y0+7-Math.floor(h/2),1,h);}
  txt(VOICE.sub,x0+13,y0+4,1,'left','#fff',null);}
// ---------- 2D helpers ----------
function ell(x,y,rx,ry,fill,stroke){ctx.beginPath();ctx.ellipse(x,y,Math.max(.5,rx),Math.max(.5,ry),0,0,Math.PI*2);
  if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
function rect(x,y,w,h,fill,stroke){if(fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);}}
function poly(pts,fill,stroke){if(!pts.length)return;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}

const CAM={pitch:0.72,yaw:0,f:310,dist:330,cx:90,cy:188};
const CY=188;
let ZOOM=1;
function playCam(){setCam(Math.sin(time*0.4)*0.08,0.72+Math.sin(time*0.3)*0.015,CY-16*(ZOOM-1));CAM.f=310*ZOOM;}
function pr(x,y,z){
  const cy=Math.cos(CAM.yaw),sy=Math.sin(CAM.yaw);const X=x*cy-z*sy,Z=x*sy+z*cy;
  const cp=Math.cos(CAM.pitch),sp=Math.sin(CAM.pitch);const Y2=y*cp-Z*sp,Z2=y*sp+Z*cp;
  const d=CAM.dist-Z2;if(d<20)return null;const s=CAM.f/d;return {x:CAM.cx+X*s,y:CAM.cy-Y2*s,s};
}
function se(T,a,r){const c=Math.cos(a),s=Math.sin(a),k=2/T.e;
  return [r*Math.sign(c)*Math.pow(Math.abs(c),k),r*T.el*Math.sign(s)*Math.pow(Math.abs(s),k)];}
const holeZ=T=>-T.Rr*T.el*0.22;
function surf(T,a,t){if(t<0){const r=T.Rr+(-t)*Math.hypot(T.depth,T.Rr-T.Rh);const [x,z]=se(T,a,r);return pr(x,3,z);}
  const r=T.Rh+(T.Rr-T.Rh)*Math.pow(1-t,0.85);const [x,z]=se(T,a,r);return pr(x,-T.depth*t,z+holeZ(T)*t);}
function drainP(T){return pr(0,-T.depth,holeZ(T));}
function inPoly(pt,pts){if(!pts)return false;let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];
  if((a.y>pt.y)!==(b.y>pt.y)&&pt.x<(b.x-a.x)*(pt.y-a.y)/(b.y-a.y)+a.x)c=!c;}return c;}
function surfaceAt(T,x,y){const q={x,y};if(inPoly(q,T._body))return 'body';if(inPoly(q,T._lid))return 'lid';if(inPoly(q,T._tank))return 'tank';return null;}
function onFixture(T,x,y){return !!surfaceAt(T,x,y);}
function floorPt(sx,sy){let bx=0,bz=0,bd=1e9,bp=null;
  for(let z=-260;z<=220;z+=24)for(let x=-320;x<=320;x+=24){const q=pr(x,-100,z);if(!q)continue;const d=(q.x-sx)**2+(q.y-sy)**2;if(d<bd){bd=d;bx=x;bz=z;bp=q;}}
  let st=12;for(let it=0;it<10;it++){for(const [dx,dz] of [[st,0],[-st,0],[0,st],[0,-st]]){const q=pr(bx+dx,-100,bz+dz);if(!q)continue;const d=(q.x-sx)**2+(q.y-sy)**2;if(d<bd){bd=d;bx+=dx;bz+=dz;bp=q;}}st*=0.6;}
  return {x:bx,z:bz,p:bp};}
function w3(T,a,t){const r=T.Rh+(T.Rr-T.Rh)*Math.pow(1-t,0.85);const [x,z]=se(T,a,r);return [x,-T.depth*t,z+holeZ(T)*t];}
function d3(A,B){return Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]);}
function nearestSurf(T,sx,sy){
  let bd=1e9,a=0,t=0,best=null;
  for(let i=0;i<32;i++){const aa=i/32*Math.PI*2;for(let j=-4;j<=10;j++){const tt=j/10*0.97;const q=surf(T,aa,tt);if(!q)continue;
    const d=(q.x-sx)**2+(q.y-sy)**2;if(d<bd){bd=d;a=aa;t=tt;best=q;}}}
  let sa=0.2,st=0.1;
  for(let it=0;it<8;it++){for(const [da,dt] of [[sa,0],[-sa,0],[0,st],[0,-st]]){const a2=a+da,t2=Math.max(-0.6,Math.min(0.97,t+dt));
    const q=surf(T,a2,t2);if(!q)continue;const d=(q.x-sx)**2+(q.y-sy)**2;if(d<bd){bd=d;a=a2;t=t2;best=q;}}sa*=0.6;st*=0.6;}
  return {a,t,p:best,d:Math.sqrt(bd)};
}
// offset along the bowl surface by world distance (rad) in direction phi
function surfOff(T,a,t,rad,phi){const r=T.Rh+(T.Rr-T.Rh)*Math.pow(1-t,0.85);const L=Math.hypot(T.depth,T.Rr-T.Rh);
  return surf(T,a+Math.cos(phi)*rad/Math.max(4,r),Math.max(-0.9,Math.min(0.99,t+Math.sin(phi)*rad/L)));}
function ringPts(T,r,y,n,a0,a1,cz){n=n||28;a0=a0||0;a1=a1===undefined?Math.PI*2:a1;cz=cz||0;const o=[];
  for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;const [x,z]=se(T,a,r);const p=pr(x,y,z+cz);if(p)o.push(p);}return o;}

      if(a.kind==='buy'){const r=B*(0.6+a.t*2.2);ctx.strokeStyle=a.t<0.4?Y:'#fff';ctx.lineWidth=2;ctx.strokeRect(cx-r/2+.5,cy-r/2+.5,r,r);ctx.lineWidth=1;
        for(let i=0;i<8;i++){const an=i/8*Math.PI*2,d=B*0.5+a.t*B*2.5;ctx.fillStyle=Y;ctx.fillRect(Math.round(cx+Math.cos(an)*d)-1,Math.round(cy+Math.sin(an)*d)-1,2,2);}}
      if(a.kind==='open'&&a.t>0.3){const r=B*(0.9+(a.t-0.3)*2);ctx.strokeStyle='#fff';ctx.strokeRect(cx-r/2+.5,cy-r/2+.5,r,r);}
    }
    if(sel){ctx.strokeStyle=Y;ctx.lineWidth=1;ctx.strokeRect(x-2.5,y-2.5,bb+5,bb+5);if(Math.floor(time*4)%2)ctx.strokeRect(x-3.5,y-3.5,bb+7,bb+7);}
  }
  ctx.restore();
  if(PL.sel)rect(0,MAP.y1,W,1,'#fff');
  // debug buttons
  const sb=(x,w,l)=>{rect(x,4,w,14,'#000',GR);txt(l,x+w/2,8,1,'center',GR,null);};sb(W-98,22,'Х2');sb(W-74,32,'МАКС');sb(W-40,37,'СБРОС');
  // coins plate
  const cw=String(PL.coins).length*12+26;rect(4,4,cw,22,'#000','#fff');ell(15,16,4,4,GR);ell(14,15,4,4,Y);ell(13,14,1.5,1.5,'#fff');txt(PL.coins,23,8,2,'left','#fff',null);
  // info
  const u=UP.find(v=>v.k===PL.sel);
  if(u){const open=unlocked(u),lv=PL.lv[u.k];
    if(!open){txt('ЗАКРЫТЫЙ УЗЕЛ',6,203,1,'left');}
    else{
      icon(u,6,204,'#fff');txt(u.n+(u.max?' '+lv+'/'+u.max:''),18,203,1,'left');
      const words=u.d.split(' ');let l1='',l2='';for(const w of words){if(!l2&&(l1+' '+w).trim().length<=28)l1=(l1+' '+w).trim();else l2=(l2+' '+w).trim();}
      txt(l1,6,215,1,'left');if(l2)txt(l2,6,225,1,'left');
      if(!u.max||lv>=u.max)txt('ПРОКАЧАНО ДО КОНЦА',6,239,1,'left',GR,null);
      else{const ok=PL.coins>=cost(u);btn(112,234,62,18,'КУПИТЬ',1,ok,false,!ok);
        ell(9,243,3,3,Y);txt(cost(u),16,239,1,'left',ok?'#fff':GR,null);}}
  }
  rect(0,256,W,1,'#fff');
  btn(20,264,140,28,'НОВЫЙ ЗАХОД',2,false,false);
  drawSub();
  txt('РЕКОРД: УНИТАЗ №'+PL.bestN,90,302,1,'center',GR,null);
}
function drawOver(){
  setCam(Math.sin(time*0.3)*0.2,0.72,CY);drawToilet(G.T);for(const st of G.stains)drawStain(st);setCam(0,0.72,CY);drawTop();
  rect(10,80,160,176,'#000');rect(10,80,160,176,null,'#fff');rect(13,83,154,170,null,'#fff');
  bigTxt('МОЧА ВСЯ',90,94,2,false);
  txt('УНИТАЗ №'+G.n,90,124,1,'center',GR,null);txt('ОСТАЛОСЬ ПЯТЕН: '+G.stains.length,90,136,1,'center',GR,null);
  ell(58,156,3.5,3.5,Y);txt('+'+G.earned+' МОНЕТ',66,152,1,'left');
  btn(24,176,132,26,'В МАГАЗИН',2,true,true);
  btn(24,210,132,26,'ЗАНОВО',2,false,false);drawSub();
}
function threshold(){const img=ctx.getImageData(0,0,W,H),d=img.data;
  for(let i=0;i<d.length;i+=4){if(d[i]>170&&d[i+1]>140&&d[i+2]<130){d[i]=255;d[i+1]=224;d[i+2]=0;}
    else if(d[i]>95&&d[i]<165&&d[i+2]-d[i]>=6){d[i]=d[i+1]=d[i+2]=128;}
    else{const v=(d[i]+d[i+1]+d[i+2])>382?255:0;d[i]=d[i+1]=d[i+2]=v;}d[i+3]=255;}ctx.putImageData(img,0,0);}
function render(){
  if(state==='title')drawTitle();
  else if(state==='shop')drawShop();
  else if(state==='over')drawOver();
  else if(state==='swap')drawSwap();
  else{
    playCam();drawRoom(G.T);drawWet(['floor','wall']);drawFixture(G.T);drawWet(['tank','lid','body']);
    for(const q of G.pool){const p=surf(G.T,q.a,q.t);if(p)ell(p.x,p.y,q.r*q.l,q.r*q.l*0.5,P[2],'#000');}
    G.stains.slice().sort((a,b)=>spos(a).y-spos(b).y).forEach(drawStain);
    drawStream();
    for(const q of G.parts){ctx.fillStyle=q.c;ctx.fillRect(q.x|0,q.y|0,2,2);}
    for(const q of G.pool){const p=surf(G.T,q.a,q.t);if(p){const y=p.y-12-(1.2-q.l)*16;txt('+'+q.v,p.x+1,y+1,1,'center','#000',null);txt('+'+q.v,p.x,y,1,'center',Y,'#000');}}
    drawHUD();
  }
  threshold();
}

// ---------- input ----------
const LIFT=64; // stream lands this far above the finger
function pos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function aim(p){G.jx=p.x;G.jy=p.y;}
let down=false,pan=null,pinch=null;const ptrs=new Map();
function zoomTo(nz,cx,cy){cx=cx===undefined?90:cx;cy=cy===undefined?118:cy;nz=Math.max(0.6,Math.min(2.5,nz));
  // keep the point under (cx,cy) fixed
  PL.vx=cx-90-(cx-90-PL.vx)*nz/PL.z;PL.vy=cy-118-(cy-118-PL.vy)*nz/PL.z;PL.z=nz;}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=pos(e);
  if(state==='title'){SFX.tap();newRun();return;}
  if(state==='over'){if(p.y>=176&&p.y<202){state='shop';refreshFog();PL.anim=[];SFX.tap();musStart();}else if(p.y>=210&&p.y<236){SFX.tap();newRun();}return;}
  if(state==='shop'){
    if(p.y>=4&&p.y<18&&p.x>=W-98){
      if(p.x<W-75){PL.coins=Math.max(10,PL.coins*2);SFX.coin();save();}
      else if(p.x<W-41){for(const u of UP)PL.lv[u.k]=u.max;applyStats();refreshFog();SFX.buy();save();}
      else{wipe();musStop();state='title';T0=mkToilet(1);SFX.tap();}
      return;}
    ptrs.set(e.pointerId,p);
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d0:Math.hypot(a.x-b.x,a.y-b.y),z0:PL.z,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,vx:PL.vx,vy:PL.vy};pan=null;return;}
    if(p.y>=MAP.y0&&p.y<(PL.sel?MAP.y1:255)){
      pan={x:p.x,y:p.y,vx:PL.vx,vy:PL.vy,moved:false};return;}
    const u=UP.find(v=>v.k===PL.sel);
    if(u&&p.y>=235&&p.y<251&&p.x>=112&&unlocked(u)&&u.max&&PL.lv[u.k]<u.max&&PL.coins>=cost(u)){buyNode(u);return;}
    if(p.y>=264&&p.y<292){musStop();newRun();}return;}
  if(state==='play'){
    if(p.x>=W-18&&p.y>=24&&p.y<42){G.bladder=0;state='over';setHiss(0);SFX.over();say('over',1);save();return;}
    down=true;G.j0x=p.x;G.j0y=p.y;aim(p);}
});
cv.addEventListener('pointermove',e=>{e.preventDefault();const p=pos(e);if(state==='play'&&down)aim(p);
  if(state!=='shop')return;
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const nz=Math.max(0.6,Math.min(2.5,pinch.z0*d/Math.max(1,pinch.d0)));
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;PL.z=pinch.z0;PL.vx=pinch.vx;PL.vy=pinch.vy;zoomTo(nz,pinch.cx,pinch.cy);PL.vx+=mx-pinch.cx;PL.vy+=my-pinch.cy;return;}
  if(pan){const dx=p.x-pan.x,dy=p.y-pan.y;if(Math.hypot(dx,dy)>3)pan.moved=true;if(pan.moved){PL.vx=pan.vx+dx;PL.vy=pan.vy+dy;}}});
const up=e=>{down=false;if(state!=='shop'){ptrs.clear();pan=null;pinch=null;return;}
  ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2){pinch=null;pan=null;}return;}
  if(pan){if(!pan.moved){const p=pos(e);let hit=null;for(const u of UP){if(!visible(u))continue;const q=nodeXY(u);const r=11;if(Math.abs(p.x-q.x)<=r&&Math.abs(p.y-q.y)<=r)hit=u;}
    if(hit){if(PL.sel===hit.k&&unlocked(hit)&&hit.max&&PL.lv[hit.k]<hit.max&&PL.coins>=cost(hit))buyNode(hit);else{PL.sel=hit.k;SFX.tap();}}else{PL.sel=null;}}pan=null;}};
cv.addEventListener('pointerup',e=>{inGesture=true;flushHaptics();up(e);inGesture=false;});cv.addEventListener('pointercancel',up);
let fitN=0;
function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(++fitN%20===0)fit();update(dt);render();musTick();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
